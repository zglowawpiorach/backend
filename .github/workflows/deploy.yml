name: Build, Push, and Sync

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  sync-inpost-points:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Run sync_inpost_points on cluster
        uses: actions-hub/kubectl@v1
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            create job --from=cronjob/sync-inpost-points sync-inpost-points-manual-${{ github.run_id }} -n zglowawpiorach

      - name: Wait for sync to complete
        uses: actions-hub/kubectl@v1
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            wait --for=condition=complete job/sync-inpost-points-manual-${{ github.run_id }} -n zglowawpiorach --timeout=120s

      - name: Clean up job
        if: always()
        uses: actions-hub/kubectl@v1
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            delete job sync-inpost-points-manual-${{ github.run_id }} -n zglowawpiorach
